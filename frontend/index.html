<!doctype html>
<!--
  HIRESENSE COMMENT INDEX - START
  ============================================================
  FILE NAME:
  frontend/index.html

  FILE PURPOSE:
  The single HTML page that the browser loads. React draws the app inside it.

  WHAT THIS FILE DOES:
  1. Sets the page title, icon and mobile viewport.
  2. Loads the Inter and Manrope fonts from Google Fonts and applies the saved theme before first paint.
  3. Contains the empty <div id="root"> and loads /src/main.jsx.

  HOW THIS FILE WORKS:
  Vite serves this file and injects the compiled JavaScript. Everything visible is created by React.

  OUTPUT:
  A page with an empty root element for React.

  ============================================================
  HIRESENSE COMMENT INDEX - END
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#10151D" />
    <meta name="description" content="HireSense - AI interview preparation and placement platform. Your Intelligence. Your Interview. Your Future." />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>HireSense - Prepare Smarter. Interview Better. Get Hired.</title>
    <script>
      // Apply the saved theme before React renders, so there is no light/dark flash (see components/ThemeContext.jsx).
      try {
        var t = localStorage.getItem("hs-theme") || "light";
        if (t === "system") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
