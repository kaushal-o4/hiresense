# Runs the automated tests on every push and pull request (once the repository is on GitHub).
# The tests never call the real AI models (see backend/tests/conftest.py), so no GPU or Ollama is needed.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hiresense
          POSTGRES_PASSWORD: hiresense
          POSTGRES_DB: hiresense
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hiresense" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -r requirements-postgres.txt
      - name: Unit and API tests (in-memory SQLite)
        if: matrix.database == 'sqlite'
        run: python -m pytest tests -q
      - name: Migrations on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          DATABASE_URL: postgresql+psycopg://hiresense:hiresense@localhost:5432/hiresense
          SECRET_KEY: ci-only-secret
        run: |
          alembic upgrade head
          python -m app.seed --demo
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
