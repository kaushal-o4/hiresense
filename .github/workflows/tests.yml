# Runs the automated tests on every push and pull request (once the repository is on GitHub).
# The tests never call the real AI models (see backend/tests/conftest.py), so no GPU or Ollama is needed.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit and API tests (MongoDB test database)
        run: python -m pytest tests -q
      - name: Seed a fresh database twice (must be repeatable)
        env:
          MONGODB_DB: hiresense_ci
        run: |
          python -m app.seed
          python -m app.seed

  # The hosted-demo profile must keep working WITHOUT torch/numpy/Whisper/Kokoro (requirements-cloud.txt).
  backend-cloud:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-cloud.txt pytest fakeredis
      - name: Deployment tests in the slim environment
        run: python -m pytest tests/test_deploy.py tests/test_account_security.py tests/test_health_and_routing.py tests/test_gemini.py -q
      - name: The app imports and seeds without the local-AI packages
        env:
          MONGODB_DB: hiresense_ci_cloud
          LOCAL_AI_PROVIDER: gemini
          EMBEDDING_PROVIDER: none
          TTS_ENABLED: "false"
          STT_ENGINE: gemini
        run: |
          python -c "import app.main"
          python -m app.seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
