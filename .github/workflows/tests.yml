# Runs the automated tests on every push and pull request (once the repository is on GitHub).
# The tests never call the real AI models (see backend/tests/conftest.py), so no GPU or Ollama is needed.
name: tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit and API tests (MongoDB test database)
        run: python -m pytest tests -q
      - name: Seed a fresh database twice (must be repeatable)
        env:
          MONGODB_DB: hiresense_ci
        run: |
          python -m app.seed
          python -m app.seed

  # The hosted-demo profile must keep working WITHOUT torch/numpy/Whisper/Kokoro (requirements-cloud.txt).
  backend-cloud:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: backend
    env:
      MONGODB_URL: mongodb://localhost:27017
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-cloud.txt pytest fakeredis
      - name: Deployment tests in the slim environment
        run: python -m pytest tests/test_deploy.py tests/test_account_security.py tests/test_health_and_routing.py tests/test_gemini.py -q
      - name: The app imports and seeds without the local-AI packages
        env:
          MONGODB_DB: hiresense_ci_cloud
          LOCAL_AI_PROVIDER: gemini
          EMBEDDING_PROVIDER: none
          TTS_ENABLED: "false"
          STT_ENGINE: gemini
        run: |
          python -c "import app.main"
          python -m app.seed

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Real browser against the real API: register, open the main student pages, one typed turn in the live interview
  # room. AI, speech and embeddings are off (question-bank questions), so it needs no GPU and no model downloads.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
    env:
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: hiresense_e2e
      SECRET_KEY: ci-only-secret-for-the-browser-smoke-test
      AI_ENABLED: "false"
      LOCAL_AI_PROVIDER: none
      EMBEDDING_PROVIDER: none
      TTS_ENABLED: "false"
      STT_ENABLED: "false"
      CORS_ORIGINS: http://127.0.0.1:4173
      FRONTEND_URL: http://127.0.0.1:4173
      HS_E2E_BASE: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend (slim) and Playwright
        working-directory: backend
        run: |
          pip install -r requirements-cloud.txt playwright
          python -m playwright install --with-deps chromium
      - name: Seed and start the API
        working-directory: backend
        run: |
          python -m app.seed
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/health/live && break; sleep 1; done
      - name: Build and serve the frontend (vite preview proxies /api to :8000)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4173/login > /dev/null && break; sleep 1; done
      - name: Browser smoke test
        working-directory: backend
        run: python tests_e2e/ci_smoke_browser.py
      - name: Server logs and screenshots
        if: failure()
        run: |
          tail -n 100 api.log web.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-smoke-output
          path: backend/tests_e2e/output/
