# Render Blueprint for the whole HireSense demo (cloud profile: Gemini, no local models). docs/DEPLOY.md.
# Render dashboard -> New -> Blueprint -> pick this repository. Render creates both services and asks
# once for the values marked "sync: false". MongoDB stays on MongoDB Atlas (free M0 cluster).
services:
  - type: web
    name: hiresense-api
    runtime: docker
    plan: free            # sleeps after 15 min without traffic; the first request then takes ~1 min
    region: singapore     # closest Render region to India
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URL          # MongoDB Atlas connection string (mongodb+srv://user:password@cluster/...)
        sync: false
      - key: MONGODB_DB
        value: hiresense
      - key: SECRET_KEY
        generateValue: true       # Render creates a long random value
      - key: COOKIE_SECURE
        value: "true"
      # lax: the browser calls the API through the web app's nginx /api proxy (hiresense-web below), so the
      # cookie is first-party. Use "none" only if some client calls this onrender.com URL directly (VITE_API_URL).
      - key: COOKIE_SAMESITE
        value: lax
      # The web app's address: nginx/CSRF checks and links in emails. These are the real service URLs
      # (Render suffixed both names, they were taken): api -8jz0, web -lv8l.
      - key: FRONTEND_URL
        value: https://hiresense-web-lv8l.onrender.com
      - key: CORS_ORIGINS
        value: https://hiresense-web-lv8l.onrender.com
      - key: ADMIN_EMAIL
        value: admin@hiresense.app
      - key: ADMIN_PASSWORD       # strong password for the first admin login
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_BACKUP_MODELS
        value: gemini-3.5-flash-lite
      - key: AI_DAILY_LIMIT_PER_USER
        value: "60"
      - key: AI_MAX_CONCURRENT
        value: "4"
      # Free instances have no persistent disk: uploaded resume FILES are lost on restart/deploy (the extracted
      # text and the analysis stay in MongoDB). Attach a Render disk at /data to keep them.
      - key: UPLOAD_DIR
        value: /tmp/hiresense-uploads
      - key: REDIS_URL            # optional; leave empty for one instance
        sync: false

  # The web app on Render as well: nginx serves the built React app and forwards /api/* to the API service
  # above, so the browser stays on one domain and the login cookie is first-party (SameSite=Lax).
  - type: web
    name: hiresense-web
    runtime: docker
    plan: free            # static content; sleeps like the API
    region: singapore     # same region as the API
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Host of the API service (no scheme). Render suffixed the name when it was taken: real host is -8jz0.
      - key: API_UPSTREAM
        value: hiresense-api-8jz0.onrender.com
      - key: API_UPSTREAM_SCHEME
        value: https
      # nginx must re-resolve the API host on every request: free services move between IPs.
      - key: API_RESOLVER_LINE
        value: "resolver 8.8.8.8 valid=30s ipv6=off;"
