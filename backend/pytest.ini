[pytest]
# Default run = fast, mocked tests only. Real-model checks: pytest tests_integration -s -v
testpaths = tests
# Temporary files go to backend/.pytest_tmp (git-ignored, emptied at the start of each run). The default location
# under %TEMP%\pytest-of-<user> failed with PermissionError on the development laptop when an older run's folder was
# still locked. Don't run two pytest processes in the same checkout at once: they share this folder.
addopts = --basetemp=.pytest_tmp
filterwarnings =
    ignore::DeprecationWarning
